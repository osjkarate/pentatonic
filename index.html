<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Pentatonic Master Trainer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; }
        .card { background: #1e293b; padding: 24px; border-radius: 20px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 25px 30px -5px #000; }
        .stats { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-weight: bold; text-transform: uppercase; margin-bottom: 14px; }
        .info { background: #020617; border-radius: 14px; padding: 14px; margin-bottom: 20px; min-height: 72px; display: flex; flex-direction: column; justify-content: center; }
        .seq { font-size: clamp(22px, 5vw, 32px); font-weight: 800; color: #38bdf8; letter-spacing: 0.08em; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 4px solid #000; border-radius: 12px; overflow: hidden; table-layout: fixed; margin-bottom: 20px; }
        td { width: 25%; position: relative; border: 2px solid #000; cursor: pointer; }
        td::after { content: ""; display: block; padding-bottom: 100%; }
        .cell { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(26px, 6vw, 40px); font-weight: 800; user-select: none; }
        .root { color: #1e40af; background: #dbeafe; }
        .ok { color: #065f46; background: #d1fae5; }
        .hint { color: #b45309; background: #fef3c7; }
        .btn-box { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 16px; background: #334155; color: #fff; font-weight: 700; font-size: 13px; text-transform: uppercase; border: none; border-radius: 12px; cursor: pointer; }
        .btn-win { background: #10b981; }
        .b-h { background: #1e293b; color: #94a3b8; border: 2px solid #334155; }
        .b-h:disabled { opacity: 0.3; cursor: not-allowed; }
        @keyframes sk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
        .shake { animation: sk 0.2s ease 2; }
    </style>
</head>
<body>
    <div id="card" class="card">
        <div class="stats"><span id="shp">Form: 1/5</span><span id="itr">Klarat: 0/3</span></div>
        <div class="info"><div id="pat" style="font-size:10px; color:#38bdf8; font-weight:800; text-transform:uppercase; margin-bottom:2px;"></div><div id="msg" style="font-size:11px; color:#a5b4fc; font-weight:800; text-transform:uppercase; margin-bottom:2px;">Klicka sekvensen!</div><div id="seq" class="seq"></div></div>
        <table id="brd"></table>
        <div class="btn-box"><button id="btn" class="btn">Starta om</button><button id="hBtn" class="btn b-h">Hint</button></div>
    </div>
    <script>
        const DATA = [
            { n: "Grundton: 1", s: [{ t: "Mönster A", p: [{r:2,c:1,v:1,u:1},{r:1,c:1,v:5},{r:1,c:3,v:6},{r:0,c:1,v:2},{r:0,c:3,v:3}] }, { t: "Mönster B", p: [{r:2,c:0,v:6},{r:2,c:3,v:1,u:1},{r:1,c:0,v:3},{r:1,c:3,v:5},{r:0,c:3,v:2}] }, { t: "Mönster C", p: [{r:2,c:0,v:5},{r:2,c:2,v:6},{r:1,c:0,v:2},{r:1,c:2,v:3},{r:0,c:3,v:1,u:1}] }, { t: "Mönster D", p: [{r:2,c:0,v:6},{r:1,c:0,v:3},{r:1,c:3,v:5},{r:0,c:1,v:1,u:1},{r:0,c:3,v:2}] }] },
            { n: "Grundton: 2", s: [{ t: "Mönster A", p: [{r:2,c:0,v:2,u:1},{r:1,c:0,v:6},{r:1,c:3,v:1},{r:0,c:0,v:3},{r:0,c:3,v:5}] }, { t: "Mönster B", p: [{r:2,c:0,v:1},{r:2,c:2,v:2,u:1},{r:1,c:0,v:5},{r:1,c:2,v:6},{r:0,c:2,v:3}] }, { t: "Mönster C", p: [{r:2,c:0,v:6},{r:2,c:3,v:1},{r:1,c:0,v:3},{r:1,c:3,v:5},{r:0,c:3,v:2,u:1}] }, { t: "Mönster D", p: [{r:2,c:1,v:1},{r:1,c:1,v:5},{r:1,c:3,v:6},{r:0,c:1,v:2,u:1},{r:0,c:3,v:3}] }] },
            { n: "Grundton: 3", s: [{ t: "Mönster A", p: [{r:2,c:0,v:3,u:1},{r:1,c:1,v:1},{r:1,c:3,v:2},{r:0,c:1,v:5},{r:0,c:3,v:6}] }, { t: "Mönster B", p: [{r:2,c:0,v:2},{r:2,c:2,v:3,u:1},{r:1,c:0,v:6},{r:1,c:3,v:1},{r:0,c:3,v:5}] }, { t: "Mönster C", p: [{r:2,c:1,v:1},{r:2,c:3,v:2},{r:1,c:1,v:5},{r:1,c:3,v:6},{r:0,c:3,v:3,u:1}] }, { t: "Mönster D", p: [{r:2,c:0,v:2},{r:1,c:0,v:6},{r:1,c:3,v:1},{r:0,c:0,v:3,u:1},{r:0,c:3,v:5}] }] },
            { n: "Grundton: 5", s: [{ t: "Mönster A", p: [{r:2,c:0,v:5,u:1},{r:1,c:0,v:2},{r:1,c:2,v:3},{r:0,c:0,v:6},{r:0,c:3,v:1}] }, { t: "Mönster B", p: [{r:2,c:0,v:3},{r:2,c:3,v:5,u:1},{r:1,c:1,v:1},{r:1,c:3,v:2},{r:0,c:3,v:6}] }, { t: "Mönster C", p: [{r:2,c:0,v:2},{r:2,c:2,v:3},{r:1,c:0,v:6},{r:1,c:3,v:1},{r:0,c:3,v:5,u:1}] }, { t: "Mönster D", p: [{r:2,c:0,v:3},{r:1,c:1,v:1},{r:1,c:3,v:2},{r:0,c:1,v:5,u:1},{r:0,c:3,v:6}] }] },
            { n: "Grundton: 6", s: [{ t: "Mönster A", p: [{r:2,c:0,v:6,u:1},{r:1,c:0,v:3},{r:1,c:3,v:5},{r:0,c:1,v:1},{r:0,c:3,v:2}] }, { t: "Mönster B", p: [{r:2,c:0,v:5},{r:2,c:2,v:6,u:1},{r:1,c:0,v:2},{r:1,c:2,v:3},{r:0,c:3,v:1}] }, { t: "Mönster C", p: [{r:2,c:0,v:3},{r:2,c:3,v:5},{r:1,c:1,v:1},{r:1,c:3,v:2},{r:0,c:3,v:6,u:1}] }, { t: "Mönster D", p: [{r:2,c:0,v:5},{r:1,c:0,v:2},{r:1,c:2,v:3},{r:0,c:0,v:6,u:1},{r:0,c:3,v:1}] }] }
        ];
        let fIdx = 0, pIdx = 0, iters = 0, state = 'play', seq = [], step = 0, okVal = new Set(), cur = null, hint = false;
        const D = document, card = D.getElementById('card'), msg = D.getElementById('msg'), seqEl = D.getElementById('seq'), brd = D.getElementById('brd'), btn = D.getElementById('btn'), pat = D.getElementById('pat'), hBtn = D.getElementById('hBtn');

        function init(keep) {
            state = 'play'; step = 0; okVal.clear(); hint = false; cur = DATA[fIdx].s[pIdx];
            okVal.add(cur.p.find(p => p.u).v);
            if (!keep) seq = cur.p.filter(p => !p.u).map(p => p.v).sort(() => Math.random() - 0.5);
            D.getElementById('shp').innerText = `${DATA[fIdx].n} (${fIdx+1}/5)`; D.getElementById('itr').innerText = `Klarat: ${iters}/3`;
            pat.innerText = cur.t; seqEl.innerText = seq.join(' - ');
            msg.innerText = "Klicka sekvensen!"; msg.style.color = "#a5b4fc";
            btn.className = "btn"; btn.innerText = "Starta om sträng"; hBtn.disabled = false; draw();
        }

        function draw() {
            brd.innerHTML = '';
            for (let r = 2; r >= 0; r--) {
                const tr = D.createElement('tr');
                for (let c = 0; c < 4; c++) {
                    const n = cur.p.find(p => p.r === r && p.c === c), td = D.createElement('td'), cell = D.createElement('div');
                    cell.className = "cell";
                    if (n) {
                        if (n.u) { cell.innerText = n.v; td.className = "root"; }
                        else if (okVal.has(n.v)) { cell.innerText = n.v; td.className = "ok"; }
                        else if (hint) { cell.innerText = n.v; td.className = "hint"; }
                    }
                    td.onclick = () => {
                        if (state !== 'play' || hint || (n && okVal.has(n.v))) return;
                        if (n && n.v === seq[step]) {
                            okVal.add(n.v); step++;
                            if (step === 4) {
                                hBtn.disabled = true;
                                if (++iters >= 3) {
                                    if (pIdx === 0) { state = 'w-p1'; msg.innerText = "Mönster A klart! Gå till B"; btn.innerText = "Starta Mönster B"; }
                                    else if (pIdx === 1) { state = 'w-p2'; msg.innerText = "Mönster B klart! Gå till C"; btn.innerText = "Starta Mönster C"; }
                                    else if (pIdx === 2) { state = 'w-p3'; msg.innerText = "Mönster C klart! Gå till D"; btn.innerText = "Starta Mönster D"; }
                                    else { state = 'w-f'; msg.innerText = "Grundton helt klar! 🎉"; btn.innerText = "Nästa Grundton"; }
                                    msg.style.color = "#34d399"; btn.className = "btn btn-win";
                                } else { msg.innerText = "Snyggt!"; setTimeout(() => init(false), 500); }
                            }
                            draw();
                        } else {
                            msg.innerText = "Fel!"; msg.style.color = "#f87171"; card.classList.add('shake');
                            okVal.clear(); okVal.add(cur.p.find(p => p.u).v); draw();
                            setTimeout(() => { card.classList.remove('shake'); init(true); }, 800);
                        }
                    };
                    td.appendChild(cell); tr.appendChild(td);
                }
                brd.appendChild(tr);
            }
        }
        btn.onclick = () => {
            if (state === 'play') init(true);
            else if (state === 'w-p1') { pIdx = 1; iters = 0; init(false); }
            else if (state === 'w-p2') { pIdx = 2; iters = 0; init(false); }
            else if (state === 'w-p3') { pIdx = 3; iters = 0; init(false); }
            else { fIdx = (fIdx + 1) % DATA.length; pIdx = 0; iters = 0; init(false); }
        };
        hBtn.onclick = () => { if (state !== 'play' || hint) return; hint = true; hBtn.disabled = true; draw(); setTimeout(() => { hint = false; if (state === 'play') hBtn.disabled = false; draw(); }, 800); };
        init();
    </script>
</body>
</html>
